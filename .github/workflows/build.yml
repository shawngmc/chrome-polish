name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            app/go.sum
            relay/go.sum

      # Fyne needs these to build at all on Linux, even just for `go
      # build`/`go test` — not only for packaging. go-gl/glfw compiles both
      # its X11 and Wayland backends unless a build tag says otherwise, so
      # the Wayland dev headers are required too.
      - name: Install Fyne Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: |
          cd app && go build ./...
          cd ../relay && go build ./...

      - name: Vet
        run: |
          cd app && go vet ./...
          cd ../relay && go vet ./...

      - name: Test
        run: |
          cd app && go test ./...
          cd ../relay && go test ./...

  package:
    name: Package (${{ matrix.platform }})
    # Fyne apps use CGO for native graphics, so each OS's package is built
    # on that OS (DESIGN.md section 6) rather than cross-compiled from one
    # runner. Only run this heavier job for tagged releases or a manual
    # trigger — not on every push/PR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: app/go.sum

      - name: Install Fyne Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        working-directory: app/cmd/chrome-polish
        shell: bash
        run: |
          go run fyne.io/fyne/v2/cmd/fyne package \
            --icon ../../Icon.png \
            --name "Chrome Polish" \
            --appID com.shawngmc.chromepolish \
            --appVersion "${{ steps.version.outputs.version }}" \
            --appBuild "${{ github.run_number }}" \
            --release

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-polish-${{ matrix.platform }}
          path: |
            app/cmd/chrome-polish/Chrome Polish.app
            app/cmd/chrome-polish/*.exe
            app/cmd/chrome-polish/*.tar.xz
          if-no-files-found: ignore

  relay:
    name: Build relay (${{ matrix.goos }}/${{ matrix.goarch }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: relay/go.sum

      # relay has no CGO/GUI dependencies, so unlike the app it cross-
      # compiles trivially for every target from one Linux runner.
      - name: Build
        working-directory: relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -o "chrome-polish-relay-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/chrome-polish-relay

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-polish-relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: relay/chrome-polish-relay-*

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
