baseURL = 'https://shawngmc.github.io/chrome-polish/'
locale = 'en-us'
title = 'Chrome Polish'

theme = 'github.com/imfing/hextra'

enableGitInfo = true

[module]
  [module.hugoVersion]
    extended = true
    min = '0.147.0'

[[module.imports]]
  path = 'github.com/imfing/hextra'

[params]
  [params.navbar]
    displayTitle = false
    [params.navbar.logo]
      path = 'images/wordmark.png'
      width = '125'
      height = '36'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[menu]
  [[menu.main]]
    name = 'Docs'
    pageRef = '/docs'
    weight = 1
  [[menu.main]]
    name = 'GitHub'
    url = 'https://github.com/shawngmc/chrome-polish'
    weight = 2
    [menu.main.params]
      icon = 'github'
